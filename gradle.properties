org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

mod_id=pocket_gallery
mod_name=Pocket Gallery
mod_version=1.2.0
mod_group=com.pocketgallery
# Shown in the mod list; set these before publishing.
mod_authors=Foresttmods
# Mod page (e.g. the Modrinth or GitHub URL). Also sent in the User-Agent of web requests, which Wikimedia asks for.
mod_homepage=https://www.curseforge.com/minecraft/mc-mods/pocket-gallery-mod
mod_issues=https://github.com/Foresttmods/pocket-gallery/issues
mod_sources=https://github.com/Foresttmods/pocket-gallery
mod_description=Import images from a folder, public-domain masterpieces from open-access museums, and photos, space images and wallpapers as Immersive Paintings - in original quality or with a Minecraft-style pixel look.

minecraft_version=26.2

# NeoForge (matches the CurseForge instance: NeoForge 26.2.0.84)
neoforge_version=26.2.0.84
neoforge_version_range=[26.2,)
neoforge_minecraft_range=[26.2,26.3)
moddev_version=2.0.141

# Fabric (26.x is unobfuscated: non-remapping Loom, no Yarn mappings)
fabric_loom_version=1.17.21
fabric_loader_version=0.19.3
fabric_api_version=0.161.0+26.2
fabric_minecraft_range=~26.2

# Immersive Paintings 0.7.9 (compiled against the released jars in libs/)
immersive_paintings_version=0.7.9
ip_neoforge_file=immersive_paintings-neoforge-26.2-0.7.9.jar
ip_fabric_file=immersive_paintings-fabric-26.2-0.7.9.jar

# "public" = Folder, Museums, Photos (what gets published).
# "personal" = also the extra tabs from common/src/personal - for your own use only, never publish it.
edition=public
