pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
}

rootProject.name = 'pocket-gallery'

// Shared code lives in common/ (plain source folders, compiled into each loader's jar).
include 'neoforge', 'fabric'
