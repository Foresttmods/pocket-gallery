plugins {
    id 'net.neoforged.moddev' version "${moddev_version}" apply false
    id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" apply false
}

/**
 * Settings shared by the loader projects. Each one compiles the common sources itself (common/src/main), plus the
 * personal-only tabs (common/src/personal) when built with -Pedition=personal.
 */
subprojects {
    apply plugin: 'java-library'

    ext.personal = rootProject.findProperty('edition') == 'personal'
    ext.editionSuffix = personal ? '-personal' : ''
    ext.loaderName = project.name

    version = mod_version
    group = mod_group

    base {
        archivesName = "${mod_id}${editionSuffix}-${loaderName}-${minecraft_version}"
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(25)

    sourceSets {
        main {
            java.srcDir rootProject.file('common/src/main/java')
            resources.srcDir rootProject.file('common/src/main/resources')
            if (personal) {
                java.srcDir rootProject.file('common/src/personal/java')
                resources.srcDir rootProject.file('common/src/personal/resources')
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked', '-Xlint:removal', '-Xlint:rawtypes'])
    }

    // Values for fabric.mod.json / neoforge.mods.toml and the generated build info class.
    ext.modProps = [
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_version             : mod_version,
            mod_description         : mod_description,
            mod_authors             : mod_authors,
            mod_homepage            : mod_homepage,
            mod_issues              : mod_issues,
            mod_sources             : mod_sources,
            neoforge_version_range  : neoforge_version_range,
            neoforge_minecraft_range: neoforge_minecraft_range,
            fabric_minecraft_range  : fabric_minecraft_range,
            immersive_paintings_version: immersive_paintings_version,
            edition                 : personal ? 'personal' : 'public',
    ]

    // BuildInfo.java: version, homepage (for the User-Agent) and edition, readable without loader APIs.
    def genDir = layout.buildDirectory.dir('generated/sources/buildinfo')
    def generateBuildInfo = tasks.register('generateBuildInfo') {
        def props = modProps
        inputs.properties(props)
        outputs.dir(genDir)
        doLast {
            def file = genDir.get().file('com/pocketgallery/BuildInfo.java').asFile
            file.parentFile.mkdirs()
            def esc = { String s -> s.replace('\\', '\\\\').replace('"', '\\"') }
            file.text = """package com.pocketgallery;

/** Generated by the build (see build.gradle). */
public final class BuildInfo {
    public static final String VERSION = "${esc(props.mod_version)}";
    public static final String HOMEPAGE = "${esc(props.mod_homepage)}";
    /** "public" or "personal". */
    public static final String EDITION = "${props.edition}";

    private BuildInfo() {
    }
}
"""
        }
    }
    sourceSets.main.java.srcDir(generateBuildInfo)
}
